name: Release
on:
  push:
    branches: [main]
    paths: ["Loto.apk", "VERSION"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V existe déjà"; exit 0; fi
          gh release create "$V" Loto.apk --target "$GITHUB_SHA" --title "Loto ${V#v}" --notes-file NOTES.md
